version: '3.9'

services:
    myapp:
        build:
            context: .
        container_name: bukuTamu
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - APP_KEY=base64:FLnk0GG0cmN/CG3swlmNwswVYrBMJrGwOqkXoSeT+X0=
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=bukutamu
            - DB_USERNAME=root
            - DB_PASSWORD=password
        depends_on:
            - mysql
    mysql:
        image: mysql:latest
        container_name: bukuTamu-mysql
        ports:
            - "3306:3306"
        volumes:
            - ./data/mysql:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=password
            - MYSQL_DATABASE=bukutamu
            - MYSQL-PASSWORD=password


